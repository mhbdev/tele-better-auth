name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            test/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci --prefix test
      - run: npm run db:generate --prefix test
      - run: npm run type-check --prefix test
      - run: npm run build --prefix test
        env:
          TELEGRAM_BOT_TOKEN: "123456789:ci-placeholder"
          TELEGRAM_BOT_USERNAME: ci_test_bot
          BETTER_AUTH_SECRET: ci-only-placeholder-secret-of-at-least-32-characters
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build
      - run: npm run test:coverage
      - run: npm run check:package
      - run: npm audit --omit=dev --audit-level=moderate
      - uses: actions/upload-artifact@v7
        if: matrix.node == 24
        with:
          name: coverage
          path: coverage/lcov.info
