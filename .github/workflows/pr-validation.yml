name: PR Package Size
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: size-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  size-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:package
      - name: Report bundle size
        run: |
          echo "## Bundle size" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Bytes |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | ---: |" >> "$GITHUB_STEP_SUMMARY"
          for file in dist/index.js dist/index.cjs dist/client.js dist/client.cjs; do
            echo "| $(basename "$file") | $(wc -c < "$file") |" >> "$GITHUB_STEP_SUMMARY"
          done
